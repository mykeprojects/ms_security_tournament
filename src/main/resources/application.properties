spring.application.name=security_ms
server.port=8181
security.jwt.secret=${JWT_SECRET:clave-local-educativa-de-32-bytes}
security.firebase.project-id=${FIREBASE_PROJECT_ID:}
security.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:[*],http://127.0.0.1:[*]}
security.notification.base-url=${NOTIFICATION_BASE_URL:http://localhost:5000}
spring.datasource.url=jdbc:mysql://localhost:3306/sport_system_db
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true