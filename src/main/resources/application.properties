spring.application.name=security_ms
server.port=8181
security.jwt.secret=${JWT_SECRET:clave-local-educativa-de-32-bytes}
security.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:[*],http://127.0.0.1:[*]}
spring.datasource.url=jdbc:mysql://localhost:3306/security_ms_db
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true